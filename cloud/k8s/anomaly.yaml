apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly
  template:
    metadata:
      labels:
        app: anomaly
    spec:
      containers:
        - name: anomaly
          image: fleetwright/anomaly:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: FLEET_BROKER_HOST
              value: mosquitto
            - name: FLEET_BROKER_PORT
              value: "1883"
            - name: FLEET_METRICS_PORT
              value: "8001"
            # Warm-up + detector knobs; ~300 samples is roughly 30s at 10 Hz before fitting.
            - name: FLEET_ANOMALY_BASELINE
              value: "300"
            - name: FLEET_ZSCORE_SIGMA
              value: "3.5"
            - name: FLEET_IF_CONTAMINATION
              value: "0.01"
          ports:
            - name: metrics
              containerPort: 8001
          # Measured ~6s of numpy/scikit-learn import before this one binds its port; the startup
          # probe absorbs that so liveness can stay tight instead of guessing an initialDelay.
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 2
            failureThreshold: 15
          # Same split as the bridge: readiness is the subscription warm-up, liveness is process-local.
          # Model warm-up is deliberately not a gate — fleet_anomaly_model_ready already reports it.
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # numpy/scikit-learn baselines make this the heaviest of the Python services.
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly
spec:
  selector:
    app: anomaly
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
