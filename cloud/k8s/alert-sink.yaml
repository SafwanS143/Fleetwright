apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-sink
  template:
    metadata:
      labels:
        app: alert-sink
    spec:
      containers:
        - name: alert-sink
          image: fleetwright/alert-sink:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9095
          # A stateless receiver: serving HTTP is the whole job, so one check covers both questions.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# ClusterIP: Alertmanager posts to it in-cluster; nothing outside needs to reach it.
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
spec:
  selector:
    app: alert-sink
  ports:
    - name: http
      port: 9095
      targetPort: http
